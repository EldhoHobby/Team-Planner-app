# Self-hosted Team Planner (dev PC) — services on two private networks.
# Only the proxy is published to the host; app and db stay internal.
#
#   docker compose up -d --build              # everything except local AI
#   docker compose --profile ai up -d --build # also ollama (EMAIL_AI_ENABLED=true)

# Log rotation for every service (Docker's default json-file log never shrinks).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: caddy:2.11.8-alpine   # pinned; bump deliberately
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The host's LAN IP — the Caddyfile reads it ({$LAN_IP}). Set it in .env.
      LAN_IP: ${LAN_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy   # no 502s while the app is still starting
    networks:
      - web
    logging: *default-logging

  # One-shot: applies the versioned migrations (prisma/migrate.sh), then exits.
  # Runs before app starts.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://planner:${DB_PASSWORD}@db:5432/planner
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    logging: *default-logging

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://planner:${DB_PASSWORD}@db:5432/planner
      APP_URL: ${APP_URL:-https://planner.localhost}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      TIMESHEET_TEMPLATE_PATH: ${TIMESHEET_TEMPLATE_PATH:-/app/timesheet-template/Time_Sheet_Template.xlsm}
      # ── Email → task ingest (Gmail via IMAP; blank = feature off) ──
      EMAIL_INGEST_ENABLED: ${EMAIL_INGEST_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-120}
      # ── Local AI email assist (Ollama, `--profile ai`; false = feature off) ──
      EMAIL_AI_ENABLED: ${EMAIL_AI_ENABLED:-false}
      EMAIL_AI_MODEL: ${EMAIL_AI_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads          # attachment storage (Attachment rows; no upload screen today)
      - ./timesheet-template:/app/timesheet-template:ro   # QEI timesheet template (host-managed)
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # node:alpine ships BusyBox wget; /api/health answers 503 when the DB is down.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - web          # reachable by proxy
      - internal     # reaches db
    # No host ports — only the proxy talks to it.
    logging: *default-logging

  # Local LLM runtime for the email→task assist. Only started with the "ai"
  # profile (`docker compose --profile ai up -d`) — hosts with
  # EMAIL_AI_ENABLED=false never run it. Internal network only. The app does
  # not depend on it: with it absent, ingest simply skips the AI step.
  ollama:
    image: ollama/ollama:0.40.14   # pinned; bump deliberately
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal
    # No host ports — only the app talks to it.
    logging: *default-logging

  # One-shot ("ai" profile): downloads the model (only when the feature is on),
  # then exits. The app does NOT wait for it — AI is optional and lazy.
  ollama-init:
    image: ollama/ollama:0.40.14   # pinned; bump deliberately
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMAIL_AI_ENABLED: ${EMAIL_AI_ENABLED:-false}
      EMAIL_AI_MODEL: ${EMAIL_AI_MODEL:-qwen2.5:3b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${EMAIL_AI_ENABLED}" != "true" ]; then
          echo "EMAIL_AI_ENABLED is not true — skipping model download."
          exit 0
        fi
        echo "Pulling $${EMAIL_AI_MODEL}..."
        tries=0
        until ollama pull "$${EMAIL_AI_MODEL}"; do
          tries=$$((tries+1))
          if [ "$$tries" -ge 5 ]; then echo "Model pull failed after 5 attempts."; exit 1; fi
          echo "Ollama not ready yet — retrying in 5s..."
          sleep 5
        done
    depends_on:
      - ollama
    networks:
      - internal
    restart: "no"
    logging: *default-logging

  db:
    image: postgres:16.15-alpine   # pinned; bump deliberately
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planner
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups:ro   # so restore is a one-liner inside this container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # No host ports — internal network only.
    logging: *default-logging

  # Postgres backups → ./backups on the host (compressed pg_dump format).
  # Dumps once at startup, then every 24 h (retries after 1 h if a dump fails):
  #   planner-YYYYMMDD-HHMMSS.dump  daily dump, pruned after BACKUP_KEEP_DAYS (14);
  #                                 the newest 3 are always kept
  #   planner-monthly-YYYYMM.dump   copy of the month's FIRST good dump, pruned
  #                                 after BACKUP_KEEP_MONTHLY_DAYS (400)
  # Pruning runs only after a SUCCESSFUL dump, so a broken pg_dump never
  # deletes the good ones.
  #   last-backup.txt               time + file name of the last SUCCESSFUL dump
  #   last-backup-error.txt         time of the last FAILED dump (deleted on success)
  # Names and times are UTC (container clock). Other dumps in the folder
  # (pre-update-*.dump, move.dump, ...) are never pruned. In-place restore (stop
  # app + backup first; safer side-database restore: DEPLOY.md 2.5):
  #   docker compose exec -T db pg_restore -U planner -d planner --clean --if-exists --no-owner /backups/<file>.dump
  backup:
    image: postgres:16.15-alpine   # pinned; bump deliberately
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHLY_DAYS: ${BACKUP_KEEP_MONTHLY_DAYS:-400}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S)
          f="planner-$$ts.dump"
          m="planner-monthly-$$(date -u +%Y%m).dump"
          if pg_dump -Fc -h db -U planner -f "/backups/$$f.part" planner && mv "/backups/$$f.part" "/backups/$$f"; then
            echo "backup: wrote $$f"
            printf '%s %s\n' "$$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$$f" > /backups/last-backup.txt
            rm -f /backups/last-backup-error.txt
            if [ ! -f "/backups/$$m" ]; then
              if cp "/backups/$$f" "/backups/$$m.part" && mv "/backups/$$m.part" "/backups/$$m"; then
                echo "backup: kept $$m (monthly copy)"
              else
                rm -f "/backups/$$m.part"
                echo "backup: could not write $$m (will retry next cycle)"
              fi
            fi
            # Prune ONLY after a good dump (a pg_dump that keeps failing must
            # never delete the last good ones), and never the newest 3 dailies.
            keep=$$(ls -1 /backups/planner-[0-9]*.dump 2>/dev/null | sort | tail -n 3 | tr '\n' ' ')
            find /backups -maxdepth 1 -name 'planner-[0-9]*.dump' -mtime +$${BACKUP_KEEP_DAYS} | while read -r old; do
              case " $$keep " in
                *" $$old "*) ;;
                *) rm -f "$$old" && echo "backup: pruned $$old" ;;
              esac
            done
            find /backups -maxdepth 1 -name 'planner-monthly-*.dump' -mtime +$${BACKUP_KEEP_MONTHLY_DAYS} -delete
            pause_s=86400
          else
            rm -f "/backups/$$f.part"
            printf '%s pg_dump FAILED - see: docker compose logs backup\n' "$$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > /backups/last-backup-error.txt
            echo "backup: pg_dump FAILED (will retry in 1 h; nothing is pruned until a dump succeeds)"
            pause_s=3600
          fi
          find /backups -maxdepth 1 -name 'planner-*.part' -mtime +1 -delete
          sleep "$$pause_s"
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

volumes:
  db_data:
  uploads:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  web:
  internal:
